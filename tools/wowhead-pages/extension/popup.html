<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.45 system-ui, sans-serif; width: 320px; margin: 12px; color: #222; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0 0 10px; }
  dt { color: #666; }
  dd { margin: 0; overflow-wrap: anywhere; }
  .problem { color: #b3261e; }
  button { font: inherit; padding: 4px 10px; margin-right: 6px; }
</style>
</head>
<body>
<h1>Wowhead crawl</h1>
<dl id="facts"></dl>
<button id="toggle" type="button">Pause</button>
<button id="show" type="button">Show the tab</button>
<script src="popup.js"></script>
</body>
</html>
