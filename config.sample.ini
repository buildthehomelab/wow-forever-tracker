; Forever Tracker configuration.
; Copy this file to config.ini and adjust it. config.ini is read by the website (PHP)
; and by the analysis tools (Python); it is outside the public folder on purpose.

[site]
name = "Forever Tracker"
; Language used when the visitor has not chosen one: en or fr.
default_language = "en"
; Languages of the site and of the stored names: "en,fr", or one alone ("en": English only, no language switch).
languages = "en,fr"
; 1: anyone can browse the tracker. 0: only logged-in staff.
public = 1
; Optional link back to your main website (shown in the sidebar and footer).
home_url = ""
home_label = ""
; Optional link to the source code, shown in the footer.
repository_url = ""

[tools]
; Python used by the "Run again" button of the Forge (the analysis runs in the background).
python = "python"

[database]
host = "127.0.0.1"
port = 3306
user = "trinity"
password = "trinity"
; Database that receives the tracker's own ft_* tables (any database the user can write to).
tracker = "forever_tracker"
; Server databases (read by the analysis; written only by the Forge, on an administrator's request).
world = "world"
hotfixes = "hotfixes"
auth = "auth"

;[build]
; The world build (docs/WORLD-BUILD.md). "tracker.py world replay" drops and rebuilds this scratch database: never
; one of the databases above.
;database = "ft_world_build"
; A MySQL account of its own, with every right on the scratch database and no right to write anywhere else. The
; replay runs your core's update files, and refuses to start with an account that could write to another database.
;user = "tracker_build"
;password = ""

[server]
; Root folder of your server. The paths below are relative to it (absolute paths work too).
root = "C:/WoW/Server"
; Folder of the DB2 files loaded by the worldserver: the one that contains SpellName.db2, ItemSparse.db2...
; Use your server's locale (enUS, frFR, deDE...).
dbc = "data/dbc/enUS"
maps = "data/maps"
vmaps = "data/vmaps"
mmaps = "data/mmaps"
; Client build of the server data (the client build you extracted data/dbc from).
build = 70450
; Optional JSON file holding that build instead: {"Build": 70450}. Leave empty to use "build".
; When both are missing, the highest gamebuild of auth.realmlist is used.
build_file = ""
; mysql command-line client used by the analysis (no Python driver needed).
mysql = "mysql/bin/mysql.exe"

[console]
; The worldserver's remote console (RA), used by the Forge to spawn creatures and objects on the running server
; (worldserver.conf: Ra.Enable = 1, Ra.IP, Ra.Port). It needs the ForeverTracker core module (".forge" commands,
; see docs/SPAWNS.md). user / password: a GAME account (account table, like "1#1") with GM level 3 on all
; realms (account_access.RealmID = -1). Leave user empty to disable.
host = "127.0.0.1"
port = 3443
user = ""
password = ""

[client]
; Game client folder (the one with _classic_beta_ or Wow.exe), to install the ForeverForge addon from the Forge.
path = ""
; The game on Blizzard's servers whose live build "tracker.py fetch" reads from the CDN (docs/CLIENT.md): wowf is
; WoW: Forever.
product = "wowf"

[forge]
; Spell ids the Forge never offers at trainers, as ids and ranges: "400000-499999, 12345". Useful for a season's
; rune abilities that the client carries but the realm does not use.
trainer_skip_ids = ""
; 0: the Forge never guesses trainer spells from the client's skill lines; trainer spells then come from imports
; (NorgannonDB, ForeverScribe, WowPacketParser files) only.
trainer_guess = 1

[sources]
; The sources, most trusted first. An import may change a row another import brought only when its source is at least
; as trusted as the row's; "questie" stands for NorgannonDB, which carries its data. Sources left out follow in the
; default order: wowhead, norgannondb, icyveins, eglink, foreverdb, atlasloot.
trust = "wowhead,questie,icyveins"
; 1: each import also compares the drops the server already has with what the source says now and proposes the new
; chance where it moved (rows the core or a more trusted source wrote are left alone). 0: imports only add.
refresh = 1
; A drop chance has moved when it changed by this share of what it was (percent), and by 0.05 points at least.
chance_tolerance = 10

[icyveins]
; Most Icy Veins lookups in one import run (two a second); the cache makes the next run go on.
max = 20000

[atlasloot]
; 1: an AtlasLoot drop with no measured chance (AtlasLoot's droprate.lua or a live Forever recording) gets an even
; share of its boss's list; 0: such drops are left out.
guess = 1

[norgannondb]
; The NorgannonDB commit the import reads (40 characters); empty: the version this tracker was tested with.
commit = ""

[wowhead]
; Wowhead branch the locator reads positions from, and the pause between two requests (seconds).
branch = "forever"
pause = 0.4
; 1: "Run again" in the Forge also asks Wowhead (new quests, items and spells the server lacks, creature checks).
analyse = 0
; Days after which a "Wowhead does not know it" answer is asked again (Wowhead learns what players discover).
recheck_days = 7
; An answer Wowhead did give is asked again after about this many days (each answer a little sooner or later, so that
; they do not all come due on one day): Wowhead corrects levels, positions and its notes. 0: kept for good.
refresh_days = 30

[collector]
; 1: the ForeverScribe notes the launcher imports are also applied at once (vendors, loot, quest givers), with a rollback.
auto_apply = 0

[phases]
; Release phases (docs/PHASES.md): content the client carries but the game has not opened yet (later raids...) shows as
; "Later" instead of missing, and stays out of the coverage and the work list until its phase opens.
; file: the phase list, relative to this folder; empty = tools/phases/forever.json, "none" = no phases. A change
; needs a new analysis.
file = ""
; current: the last phase your realm has opened. Empty = each phase opens on its date (a phase with no date stays
; closed). Or a phase key (first-raids), a number (1 = the first phase), "all" or "none". Read by the website: no
; new analysis needed.
current = ""

[admin]
; Game accounts (Battle.net e-mail and password) with at least this GM level can log in as administrators.
gm_level = 3
; Default vendor (creature_template entry) proposed by the Forge to sell items that have no source.
vendor_entry = 0

; Local administrators that do not need a game account: name = "password hash".
; Create a hash with:  php tools/hash-password.php "your password"
[admins]
