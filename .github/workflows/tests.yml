name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python tests (no database: those that need one are skipped)
        # the tools read config.ini when they are imported; the sample is enough for the tests
        env:
          FOREVER_TRACKER_CONFIG: config.sample.ini
        run: python3 -m unittest discover -s tools/tests
      - name: PHP syntax
        run: find app public tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Shell syntax
        run: sh -n docker/entrypoint.sh
