name: Source integration tests
on:
  pull_request:
  push:
    branches: [main, 'codex/foreverchanges-source']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python source and resolver tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: PHP syntax
        run: find app tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Source panel escaping and build labels
        run: php tools/tests/foreverchanges-panel.php
