; Room for the Forge and for world data files imported through the browser
memory_limit = 1024M
upload_max_filesize = 512M
post_max_size = 512M
max_execution_time = 300
expose_php = Off

; Logins survive a restart of the container: sessions are kept in the data volume (docker/entrypoint.sh makes the
; folder), not in the container's own /tmp. A session left alone for 7 days is removed.
session.save_path = "/opt/forever-tracker/data/sessions"
session.gc_maxlifetime = 604800
session.gc_probability = 1
session.gc_divisor = 100
